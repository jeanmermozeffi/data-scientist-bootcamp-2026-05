<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="400" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="410" y="32" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >BERT (encodeur) vs GPT (décodeur) : qui voit quoi ?</text>
<text x="210" y="65" font-size="13" fill="#d4581f" text-anchor="middle" font-weight="bold" font-style="normal" >BERT — encodeur, bidirectionnel</text>
<rect x="60" y="90" width="60" height="40" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="90" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >le</text>
<rect x="130" y="90" width="60" height="40" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="160" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >chat</text>
<rect x="200" y="90" width="60" height="40" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="230" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >?</text>
<rect x="270" y="90" width="60" height="40" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="300" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >la</text>
<rect x="340" y="90" width="60" height="40" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="370" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >pomme</text>
<line x1="230" y1="130" x2="90" y2="150" stroke="#d4581f" stroke-width="1.3"/>
<line x1="230" y1="130" x2="160" y2="150" stroke="#d4581f" stroke-width="1.3"/>
<line x1="230" y1="130" x2="300" y2="150" stroke="#d4581f" stroke-width="1.3"/>
<line x1="230" y1="130" x2="370" y2="150" stroke="#d4581f" stroke-width="1.3"/>
<text x="210" y="170" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >la position masquée regarde À GAUCHE et À DROITE</text>
<text x="610" y="65" font-size="13" fill="#7b93b3" text-anchor="middle" font-weight="bold" font-style="normal" >GPT — décodeur, causal</text>
<rect x="460" y="90" width="60" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="490" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >le</text>
<rect x="530" y="90" width="60" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="560" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >chat</text>
<rect x="600" y="90" width="60" height="40" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="630" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >?</text>
<rect x="670" y="90" width="60" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="700" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >la</text>
<rect x="740" y="90" width="60" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="770" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >pomme</text>
<line x1="490" y1="130" x2="630" y2="150" stroke="#7b93b3" stroke-width="1.3"/>
<line x1="560" y1="130" x2="630" y2="150" stroke="#7b93b3" stroke-width="1.3"/>
<text x="610" y="170" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >chaque position ne regarde QUE ce qui précède</text>
<line x1="410" y1="50" x2="410" y2="370" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="4,4"/>
<text x="210" y="230" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >→ comprendre un texte entier</text>
<text x="210" y="252" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >(classification, NER, Q/R)</text>
<text x="610" y="230" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >→ générer la suite d'un texte</text>
<text x="610" y="252" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >(complétion, chat, rédaction)</text>
<text x="410" y="300" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >Résultat mesuré dans ce cours (accord de genre, prédire l'article masqué) :</text>
<text x="210" y="325" font-size="13" fill="#14875e" text-anchor="middle" font-weight="bold" font-style="normal" >BERT (bidirectionnel) : 100 %</text>
<text x="610" y="325" font-size="13" fill="#d4581f" text-anchor="middle" font-weight="bold" font-style="normal" >GPT (causal) : 47 % (≈ hasard)</text>
<text x="410" y="365" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-style="italic" >le décodeur ne peut pas voir le nom qui vient APRÈS l'article : il ne peut que deviner</text>
</svg>
