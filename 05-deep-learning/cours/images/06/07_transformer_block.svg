<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="760" height="560" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="380" y="30" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Un bloc Transformer encodeur (celui de BERT)</text>
<rect x="260" y="470" width="240" height="46" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="380" y="498" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Embeddings + encodage positionnel</text>
<line x1="380" y1="470" x2="380" y2="430" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="260" y="380" width="240" height="50" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="380" y="402" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Self-attention multi-têtes</text>
<text x="380" y="420" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >(Q, K, V — toutes positions)</text>
<line x1="380" y1="380" x2="380" y2="345" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="230" y="300" width="300" height="44" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="2"/>
<text x="380" y="326" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Add & Norm  (résiduel + LayerNorm)</text>
<path d="M 260 405 C 150 405, 150 320, 232 320" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fl)"/>
<line x1="380" y1="300" x2="380" y2="265" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="260" y="215" width="240" height="50" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="380" y="237" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Feed-Forward (par position)</text>
<text x="380" y="255" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >Linéaire → ReLU → Linéaire</text>
<line x1="380" y1="215" x2="380" y2="180" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="230" y="135" width="300" height="44" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="2"/>
<text x="380" y="161" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Add & Norm  (résiduel + LayerNorm)</text>
<path d="M 260 240 C 150 240, 150 155, 232 155" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fl)"/>
<line x1="380" y1="135" x2="380" y2="100" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="260" y="55" width="240" height="44" rx="8" fill="#fff4ea" stroke="#e3a37f" stroke-width="2"/>
<text x="380" y="82" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Sortie du bloc → bloc suivant (×N)</text>
<text x="620" y="250" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal" >⟲ répété N fois</text>
<text x="620" y="270" font-size="11" fill="#898781" text-anchor="start" font-weight="normal" font-style="normal" >(2 à 24 selon la taille)</text>
<text x="130" y="400" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >⚙️ chaque position</text>
<text x="130" y="416" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >regarde TOUTES</text>
<text x="130" y="432" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >les autres (gauche</text>
<text x="130" y="448" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >ET droite) : c'est</text>
<text x="130" y="464" font-size="11" fill="#d4581f" text-anchor="middle" font-weight="bold" font-style="normal" >ce qui fait BERT</text>
</svg>
