<text x="440" y="370" font-size="13" fill="#d4581f" text-anchor="middle" font-weight="bold" font-style="normal" >⚠️ Toute l'information de l'entrée doit passer par UN SEUL vecteur de contexte</text>
<text x="440" y="394" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >→ quand la séquence s'allonge, ce vecteur devient un goulot d'étranglement</text>
