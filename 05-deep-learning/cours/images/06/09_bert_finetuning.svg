<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="470" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="440" y="32" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Pré-entraînement puis fine-tuning de BERT</text>
<text x="220" y="60" font-size="14" fill="#d4581f" text-anchor="middle" font-weight="bold" font-style="normal" >① PRÉ-ENTRAÎNEMENT</text>
<text x="220" y="80" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >texte non étiqueté, à grande échelle</text>
<rect x="60" y="100" width="320" height="80" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="220" y="132" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Masked Language Model</text>
<text x="220" y="154" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >"le [MASK] mange la pomme" → "chat"</text>
<rect x="60" y="195" width="320" height="40" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="220" y="220" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >+ Next Sentence Prediction</text>
<path d="M 380 160 C 450 160, 450 160, 520 160" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<text x="450" y="145" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >on copie</text>
<text x="450" y="180" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >le corps</text>
<text x="700" y="60" font-size="14" fill="#14875e" text-anchor="middle" font-weight="bold" font-style="normal" >② FINE-TUNING</text>
<text x="700" y="80" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >une petite tête par tâche</text>
<rect x="560" y="100" width="320" height="70" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="720" y="125" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Corps BERT pré-entraîné</text>
<text x="720" y="147" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >(copié, puis affiné)</text>
<rect x="515" y="195" width="130" height="70" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="580" y="222" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Classification</text>
<text x="580" y="244" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >[CLS] → sentiment</text>
<line x1="720" y1="170" x2="580" y2="195" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="655" y="195" width="130" height="70" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="720" y="222" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >NER</text>
<text x="720" y="244" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >chaque token → entité</text>
<line x1="720" y1="170" x2="720" y2="195" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="795" y="195" width="130" height="70" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="860" y="222" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >Q/R</text>
<text x="860" y="244" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >span de la réponse</text>
<line x1="720" y1="170" x2="860" y2="195" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<text x="440" y="300" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >Le token [CLS] en tête de séquence résume toute la phrase pour la classification</text>
<rect x="240" y="320" width="80" height="40" rx="8" fill="#fff4ea" stroke="#e3a37f" stroke-width="2"/>
<text x="280" y="345" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >[CLS]</text>
<rect x="325" y="320" width="70" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="360" y="345" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >le</text>
<rect x="405" y="320" width="70" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="440" y="345" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >chat</text>
<rect x="485" y="320" width="70" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="520" y="345" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >mange</text>
<rect x="565" y="320" width="70" height="40" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="600" y="345" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal" >...</text>
<path d="M 280 320 C 280 290, 280 280, 280 260" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<text x="440" y="410" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal" >Limites : longueur de contexte fixe (512 tokens), coût de calcul en O(L²)</text>
<text x="440" y="432" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-style="normal" >pour un entraînement et une inférence from scratch</text>
</svg>
