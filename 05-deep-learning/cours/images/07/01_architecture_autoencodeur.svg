<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="420" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>

<text x="440" y="34" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Autoencodeur : encodeur → goulot d'étranglement latent → décodeur</text>

<!-- entrée -->
<rect x="30" y="140" width="80" height="110" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="70" y="188" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Entrée</text>
<text x="70" y="206" font-size="11" fill="#52514e" text-anchor="middle">x</text>
<text x="70" y="222" font-size="11" fill="#52514e" text-anchor="middle">(64 px)</text>

<path d="M 114 195 L 150 195" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl1)"/>

<!-- encodeur : couches qui retrecissent -->
<rect x="154" y="120" width="70" height="150" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="189" y="150" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Encodeur</text>
<text x="189" y="168" font-size="10" fill="#52514e" text-anchor="middle">couche(s)</text>
<text x="189" y="184" font-size="10" fill="#52514e" text-anchor="middle">cachée(s)</text>
<text x="189" y="240" font-size="10" fill="#52514e" text-anchor="middle">32 neurones</text>

<path d="M 228 195 L 264 195" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl1)"/>

<!-- goulot latent -->
<rect x="268" y="168" width="60" height="54" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2.5"/>
<text x="298" y="190" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">z</text>
<text x="298" y="206" font-size="10" fill="#52514e" text-anchor="middle">latent</text>
<text x="298" y="250" font-size="11" fill="#14875e" text-anchor="middle" font-weight="bold">goulot</text>
<text x="298" y="265" font-size="11" fill="#14875e" text-anchor="middle" font-weight="bold">d'étranglement</text>
<text x="298" y="280" font-size="10" fill="#52514e" text-anchor="middle">(2 à 8 dimensions)</text>

<path d="M 332 195 L 368 195" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl1)"/>

<!-- decodeur : couches qui regrandissent -->
<rect x="372" y="120" width="70" height="150" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="407" y="150" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Décodeur</text>
<text x="407" y="168" font-size="10" fill="#52514e" text-anchor="middle">couche(s)</text>
<text x="407" y="184" font-size="10" fill="#52514e" text-anchor="middle">cachée(s)</text>
<text x="407" y="240" font-size="10" fill="#52514e" text-anchor="middle">32 neurones</text>

<path d="M 446 195 L 482 195" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl1)"/>

<!-- sortie reconstruite -->
<rect x="486" y="140" width="90" height="110" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="531" y="188" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Reconstruction</text>
<text x="531" y="206" font-size="11" fill="#52514e" text-anchor="middle">x̂</text>
<text x="531" y="222" font-size="11" fill="#52514e" text-anchor="middle">(64 px)</text>

<!-- loss en dessous -->
<path d="M 70 256 C 70 340, 531 340, 531 256" fill="none" stroke="#d4581f" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="245" y="326" width="140" height="34" rx="8" fill="#fff" stroke="#d4581f" stroke-width="1.5"/>
<text x="315" y="348" font-size="12" fill="#d4581f" text-anchor="middle" font-weight="bold">loss = ‖x̂ − x‖²</text>

<!-- usage de z -->
<rect x="620" y="60" width="230" height="300" rx="10" fill="#fff" stroke="#b9b7b0" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="735" y="86" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Ce que porte z</text>
<text x="640" y="112" font-size="11" fill="#52514e">• réduction de dimension</text>
<text x="640" y="134" font-size="11" fill="#52514e">  (64 → 2-8 nombres)</text>
<text x="640" y="162" font-size="11" fill="#52514e">• débruitage : entrée bruitée</text>
<text x="640" y="182" font-size="11" fill="#52514e">  → cible propre</text>
<text x="640" y="210" font-size="11" fill="#52514e">• détection d'anomalies :</text>
<text x="640" y="230" font-size="11" fill="#52514e">  loss de reconstruction</text>
<text x="640" y="248" font-size="11" fill="#52514e">  élevée = anormal</text>
<text x="640" y="276" font-size="11" fill="#52514e">• mais : z non structuré</text>
<text x="640" y="296" font-size="11" fill="#52514e">  (pas de contrainte sur</text>
<text x="640" y="316" font-size="11" fill="#52514e">  sa forme) → partie II</text>

<path d="M 298 168 C 298 100, 500 60, 615 120" fill="none" stroke="#7b93b3" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fl1)"/>
</svg>
