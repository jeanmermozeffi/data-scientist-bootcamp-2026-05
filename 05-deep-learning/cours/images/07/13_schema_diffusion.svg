<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="400" rx="14" fill="#fcfcfb"/>
<defs>
<marker id="fl3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="fl4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14875e"/></marker>
</defs>

<text x="440" y="32" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Diffusion : détruire pas à pas avec du bruit, puis apprendre à l'inverser</text>

<text x="110" y="70" font-size="13" fill="#d4581f" text-anchor="middle" font-weight="bold">x₀ (donnée)</text>
<circle cx="110" cy="120" r="34" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="110" y="125" font-size="10" fill="#0b0b0b" text-anchor="middle">structure</text>

<path d="M 148 120 L 222 120" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl3)"/>
<text x="185" y="106" font-size="10" fill="#52514e" text-anchor="middle">+ bruit</text>

<circle cx="260" cy="120" r="34" fill="#f3e3cf" stroke="#c98a35" stroke-width="2"/>
<text x="260" y="70" font-size="11" fill="#52514e" text-anchor="middle">x₁</text>

<path d="M 298 120 L 372 120" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl3)"/>
<text x="335" y="106" font-size="10" fill="#52514e" text-anchor="middle">+ bruit</text>

<circle cx="410" cy="120" r="34" fill="#e8dce8" stroke="#8a5a9a" stroke-width="2"/>
<text x="410" y="70" font-size="11" fill="#52514e" text-anchor="middle">x_t (...)</text>

<path d="M 448 120 L 522 120" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl3)"/>
<text x="485" y="106" font-size="10" fill="#52514e" text-anchor="middle">+ bruit</text>

<circle cx="560" cy="120" r="34" fill="#e8eef6" stroke="#7b93b3" stroke-width="2.5"/>
<text x="560" y="70" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">x_T</text>
<text x="560" y="125" font-size="9" fill="#0b0b0b" text-anchor="middle">≈ bruit pur</text>
<text x="560" y="137" font-size="9" fill="#0b0b0b" text-anchor="middle">𝒩(0, I)</text>

<rect x="20" y="150" width="620" height="24" rx="6" fill="#fff" stroke="none"/>
<text x="330" y="167" font-size="12" fill="#d4581f" text-anchor="middle" font-weight="bold">PROCESSUS DIRECT (forward) — fixe, pas de réseau, on sait calculer x_t directement à partir de x₀</text>

<!-- reverse -->
<path d="M 560 220 L 486 220" fill="none" stroke="#14875e" stroke-width="2.2" marker-end="url(#fl4)"/>
<text x="523" y="206" font-size="10" fill="#14875e" text-anchor="middle">réseau ε̂</text>

<circle cx="410" cy="220" r="34" fill="#e8dce8" stroke="#8a5a9a" stroke-width="2"/>
<text x="410" y="270" font-size="11" fill="#52514e" text-anchor="middle">x_t-1</text>

<path d="M 372 220 L 298 220" fill="none" stroke="#14875e" stroke-width="2.2" marker-end="url(#fl4)"/>
<text x="335" y="206" font-size="10" fill="#14875e" text-anchor="middle">réseau ε̂</text>

<circle cx="260" cy="220" r="34" fill="#f3e3cf" stroke="#c98a35" stroke-width="2"/>
<text x="260" y="270" font-size="11" fill="#52514e" text-anchor="middle">x... (...)</text>

<path d="M 222 220 L 148 220" fill="none" stroke="#14875e" stroke-width="2.2" marker-end="url(#fl4)"/>
<text x="185" y="206" font-size="10" fill="#14875e" text-anchor="middle">réseau ε̂</text>

<circle cx="110" cy="220" r="34" fill="#e3f6ee" stroke="#14875e" stroke-width="2.5"/>
<text x="110" y="270" font-size="12" fill="#14875e" text-anchor="middle" font-weight="bold">x₀ généré</text>

<text x="330" y="330" font-size="12" fill="#14875e" text-anchor="middle" font-weight="bold">PROCESSUS INVERSE (reverse) — appris : à chaque étape, un petit réseau prédit le bruit ε à retirer</text>
<text x="330" y="352" font-size="11" fill="#52514e" text-anchor="middle">on part d'un bruit pur x_T ~ 𝒩(0, I) et on remonte jusqu'à x₀ en retirant le bruit prédit, étape par étape</text>
<text x="330" y="374" font-size="11" fill="#52514e" text-anchor="middle">le réseau prend en entrée (x_t, t) : il doit connaître le niveau de bruit pour savoir combien en retirer</text>
</svg>
