<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="880" height="460" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>

<text x="440" y="32" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">VAE : l'encodeur produit une distribution, pas un point</text>

<!-- entrée -->
<rect x="30" y="170" width="78" height="100" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="69" y="214" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Entrée</text>
<text x="69" y="232" font-size="11" fill="#52514e" text-anchor="middle">x</text>

<path d="M 112 220 L 146 220" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>

<rect x="150" y="150" width="70" height="140" rx="8" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="185" y="180" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Encodeur</text>

<path d="M 224 190 L 256 160" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>
<path d="M 224 250 L 256 280" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>

<rect x="260" y="130" width="64" height="44" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="292" y="157" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">μ</text>
<rect x="260" y="258" width="64" height="44" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2"/>
<text x="292" y="285" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">log σ²</text>

<!-- echantillonnage -->
<path d="M 324 152 L 372 198" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>
<path d="M 324 280 L 372 222" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>

<rect x="376" y="188" width="150" height="44" rx="8" fill="#e8eef6" stroke="#7b93b3" stroke-width="2.5"/>
<text x="451" y="214" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">z = μ + σ ⊙ ε</text>

<rect x="400" y="248" width="100" height="36" rx="8" fill="#fff" stroke="#b9b7b0" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="450" y="271" font-size="11" fill="#52514e" text-anchor="middle">ε ~ 𝒩(0, I)</text>
<path d="M 450 248 L 450 232" fill="none" stroke="#7b93b3" stroke-width="1.5" marker-end="url(#fl2)"/>

<path d="M 530 210 L 566 210" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>

<rect x="570" y="150" width="70" height="140" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="605" y="180" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Décodeur</text>

<path d="M 644 220 L 678 220" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#fl2)"/>

<rect x="682" y="170" width="90" height="100" rx="8" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="727" y="214" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Reconstruction</text>
<text x="727" y="232" font-size="11" fill="#52514e" text-anchor="middle">x̂</text>

<!-- loss box -->
<rect x="60" y="340" width="720" height="92" rx="10" fill="#fff" stroke="#b9b7b0" stroke-width="1.5"/>
<text x="420" y="366" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Loss = reconstruction + β × KL( q(z|x) ‖ 𝒩(0, I) )</text>
<text x="420" y="392" font-size="11" fill="#52514e" text-anchor="middle">le terme de reconstruction rapproche x̂ de x ; le terme KL force la distribution de z à rester proche d'une normale standard</text>
<text x="420" y="414" font-size="11" fill="#52514e" text-anchor="middle">→ l'espace latent reste compact, centré et continu : on peut y échantillonner pour générer de nouvelles données</text>
</svg>
